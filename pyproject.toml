[project]
name = "a-world-for-two"
version = "0.1.0"
description = "Local Windows control room and reproducible Minecraft pack for KG and Sera"
requires-python = ">=3.12"
dependencies = ["psutil==7.2.2"]

[project.scripts]
awft = "control_room.__main__:main"

[tool.setuptools.package-data]
control_room = ["static/*"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
