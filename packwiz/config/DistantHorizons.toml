# Exact DH 3.3.3 keys verified in a real disposable server.
[server]
maxGenerationRequestDistance = 128
maxSyncOnLoadRequestDistance = 128
generationRequestRateLimit = 4
syncOnLoadRateLimit = 20
realTimeUpdateDistanceRadiusInChunks = 128
playerBandwidthLimit = 500
globalBandwidthLimit = 1000
[common.multiThreading]
numberOfThreads = 2
threadRunTimeRatio = "0.5"
[common.worldGenerator]
limitIfServerUnhealthy = true
generatorPlan = "SURFACE_THEN_CHUNKS"
# SURFACE avoids a confirmed Lithostitched feature-predicate chunk future at shutdown.
# Full player-driven terrain still includes features; distant fallback decoration is reduced.
chunkGeneratorMode = "SURFACE"
[client.advanced.graphics.quality]
# Planned KG starting profile; the generated native default was 256.
lodChunkRenderDistanceRadius = 128
