name: Publish approved immutable Packwiz snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-packwiz-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out reviewed publication catalog and all tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate source separately from publication approval
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python -m tools.pack validate
          node --check control_room/static/app.js
          node --check control_room/static/atlas.js
          node --test tests/session.test.mjs
      - name: Package only catalog-approved Git-tag snapshots
        run: python -m tools.publish_snapshot --output "$RUNNER_TEMP/awft-public"
      - name: Read existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Upload the reviewed static tree
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/awft-public
          retention-days: 1
  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
