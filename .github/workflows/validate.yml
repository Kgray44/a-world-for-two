name: Validate source and Packwiz
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m tools.pack validate
      - run: node --check control_room/static/app.js
      - run: node --check control_room/static/atlas.js
      - run: node --test tests/session.test.mjs
